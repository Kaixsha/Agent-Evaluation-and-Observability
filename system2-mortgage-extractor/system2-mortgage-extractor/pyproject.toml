[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mortgage-extractor"
version = "0.1.0"
description = "Schema-enforced two-pass mortgage document extraction"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.6",
]

[project.scripts]
mortgage-extract = "mortgage_extractor.cli:main"

[tool.setuptools.packages.find]
include = ["mortgage_extractor*"]
exclude = ["tests*", "fixtures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
